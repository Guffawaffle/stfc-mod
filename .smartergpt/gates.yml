version: 1
levels:
  default:
    - name: diff-check
      run: "git diff --check"
      runtime: local
  windows-launcher:
    - name: dotnet-test
      run: "dotnet test"
      runtime: local
    - name: windows-proxy-build
      run: "xmake f -p windows -m release -y && xmake -y stfc-community-mod"
      runtime: local
