name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, dev, play, play-dev, review/ripper-play-migration-checkpoint-20261025]
  pull_request:
    branches: [main, dev, play, play-dev]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build-win:
    runs-on: windows-2025-vs2026
    outputs:
      run_attempt: ${{ steps.build_identity.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-size-limit: 6144
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          # Zig 0.16 uses Clang 21. The runner's newer MSVC STL requires Clang 22.
          toolset: "14.44"
      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        if: github.repository == 'Guffawaffle/stfc-mod'
        with:
          xmake-version: "3.0.8"
      - name: Stamp commit hash
        run: python scripts/stamp-version-hash.py "${{ github.sha }}"
      - name: Provision Windows build sysroot
        id: windows_sysroot
        shell: pwsh
        env:
          STFC_WINDOWS_TOOLCHAIN_URL: ${{ vars.STFC_WINDOWS_TOOLCHAIN_URL }}
        run: |
          if ($env:STFC_WINDOWS_TOOLCHAIN_URL) {
            python scripts/ci-build-retry.py --prefetch -- zig build fetch-toolchains
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            # Zig's native discovery reads the default toolset even inside a pinned developer shell.
            $root = Join-Path $env:RUNNER_TEMP 'stfc-msvc-sysroot'
            $sdkVersion = $env:WindowsSDKVersion.TrimEnd('\', '/')
            New-Item -ItemType Directory -Path $root, "$root/msvc", "$root/winsdk" | Out-Null
            $links = @{
              'msvc/include' = Join-Path $env:VCToolsInstallDir 'include'
              'msvc/lib' = Join-Path $env:VCToolsInstallDir 'lib'
              'winsdk/include' = Join-Path $env:WindowsSdkDir "Include/$sdkVersion"
              'winsdk/lib' = Join-Path $env:WindowsSdkDir "Lib/$sdkVersion"
            }
            foreach ($link in $links.GetEnumerator()) {
              New-Item -ItemType Junction -Path (Join-Path $root $link.Key) -Target $link.Value | Out-Null
            }
            "path=$root" >> $env:GITHUB_OUTPUT
          }
      - name: Build and test
        id: build_identity
        shell: pwsh
        env:
          STFC_WINDOWS_MSVC_SYSROOT: ${{ steps.windows_sysroot.outputs.path }}
        run: |
          "run_attempt=${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT
          $sysrootArgs = @()
          if ($env:STFC_WINDOWS_MSVC_SYSROOT) { $sysrootArgs += "-Dmsvc-sysroot=$env:STFC_WINDOWS_MSVC_SYSROOT" }
          python scripts/ci-build-retry.py --prefetch -- zig build install test-toolchains test-codegen test-deps test-il2cpp test-mod test-sync test-spud `
            -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast -Dtest-optimize=Debug `
            "-Dstfc_source_state_id=git:${{ github.sha }}" `
            "-Dstfc_base_commit=${{ github.sha }}" `
            "-Dstfc_build_invocation_id=github:${{ github.run_id }}:${{ github.run_attempt }}:windows" `
            -Dstfc_build_channel=ci -Dprofiles=${{ github.repository == 'Guffawaffle/stfc-mod' }} @sysrootArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify proxy binary contract
        run: >-
          python scripts/verify-windows-binary.py ${{ github.repository == 'Guffawaffle/stfc-mod' && '--profiles-host' || '' }} --identity
          "stfc-identity-v1;distribution=netniv.stfc-community-mod;source=git:${{ github.sha }};base=${{ github.sha }};build=github:${{ github.run_id }}:${{ github.run_attempt }}:windows;mode=release;channel=ci"
      - name: Verify Windows version identity
        shell: pwsh
        run: |
          $header = Get-Content -LiteralPath src/mod/version.h -Raw
          $components = foreach ($key in @('MAJOR', 'MINOR', 'REVISION', 'PATCH')) {
            if ($header -notmatch "(?m)^#define\s+VERSION_$key\s+(\d+)\s*$") {
              throw "Missing VERSION_$key"
            }
            $Matches[1]
          }
          $fixedVersion = $components -join '.'
          $productVersion = $fixedVersion
          if ($header -match '(?m)^#define\s+VERSION_FORK_REVISION\s+(\d+)\s*$') {
            $forkRevision = [uint32]$Matches[1]
            $productVersion = if ($forkRevision) {
              "$fixedVersion-guffa.$forkRevision"
            } elseif ([uint32]$components[0] -ge 2) {
              $components[0..2] -join '.'
            } else {
              $fixedVersion
            }
          }
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path zig-out/bin/version.dll).Path)
          $actualFixed = '{0}.{1}.{2}.{3}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart
          if ($actualFixed -cne $fixedVersion -or $info.ProductVersion -cne $productVersion) {
            throw "DLL version does not match its producing source"
          }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: stfc-community-mod
          path: zig-out/bin/version.dll
          if-no-files-found: error
      - name: Stage matching Profiles helper and notices
        if: github.repository == 'Guffawaffle/stfc-mod'
        shell: pwsh
        run: |
          python scripts/windows-profiles-package.py stage --prefix zig-out --output profiles-windows `
            --source "${{ github.sha }}" --base "${{ github.sha }}" --run "${{ github.run_id }}:${{ github.run_attempt }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.1
        if: github.repository == 'Guffawaffle/stfc-mod'
        with:
          name: stfc-community-mod-profiles-windows
          path: profiles-windows
          if-no-files-found: error

  cross-win:
    # Enable this by configuring a hosted sysroot URL; no temporary URL is committed.
    if: ${{ vars.STFC_WINDOWS_TOOLCHAIN_URL != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Fetch and cross-compile
        env:
          STFC_WINDOWS_TOOLCHAIN_URL: ${{ vars.STFC_WINDOWS_TOOLCHAIN_URL }}
        run: |
          python3 scripts/ci-build-retry.py --prefetch -- zig build fetch-toolchains
          python3 scripts/ci-build-retry.py --prefetch -- zig build install build-tests -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast -Dtest-optimize=Debug
          python3 scripts/verify-windows-binary.py

  # The native fixtures need no SDK, so they run on Linux too, where they are cheapest.
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Test
        run: python3 scripts/ci-build-retry.py --prefetch -- zig build test-toolchains test-codegen test-il2cpp test-mod test-sync test-launcher test-spud
      - name: Check version and publication contract
        run: |
          python3 -m unittest discover -s tests -p mac_build_identity_test.py
          python3 -m unittest discover -s tests -p mac_release_context_test.py
          python3 -m unittest discover -s tests -p update_release_index_test.py

  build-mac:
    name: build-mac (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The relocation test only has work on x86_64.
          - arch: arm64
            target: aarch64-macos.14.6
            runner: macos-26
            artifact: macos-arm64-build
            tests: test-sync test-launcher
          - arch: x86_64
            target: x86_64-macos.14.6
            runner: macos-26-intel
            artifact: macos-x86_64-build
            tests: test-sync test-launcher test-spud
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Stamp commit hash
        run: python3 scripts/stamp-version-hash.py "${{ github.sha }}"
      - name: Build and test
        run: |
          python3 scripts/ci-build-retry.py --prefetch -- zig build install launcher test-toolchains test-codegen test-deps test-il2cpp test-mod ${{ matrix.tests }} \
            -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Dtest-optimize=Debug --summary all \
            -Dprofiles=${{ github.repository == 'Guffawaffle/stfc-mod' }} \
            -Dlauncher_channel=ci \
            -Dlauncher_source=${{ github.sha }} \
            -Dlauncher_run_id=${{ github.run_id }} \
            -Dlauncher_run_number=${{ github.run_number }} \
            -Dlauncher_run_attempt=${{ github.run_attempt }}
      - name: Verify launcher version identity
        run: python3 scripts/verify-version-substitution.py --channel ci --source "${{ github.sha }}"
      - name: Verify portable linkage
        run: |
          scripts/check-mac-linkage.sh zig-out/macOSLauncher.app/Contents/MacOS/macOSLauncher \
            zig-out/bin/stfc-community-mod-loader zig-out/lib/libstfc-community-mod.dylib
          if [[ "$GITHUB_REPOSITORY" == Guffawaffle/stfc-mod ]]; then
            scripts/check-mac-linkage.sh zig-out/bin/stfc-profiles
          fi
      - name: Retain native-detour fixture for architecture qualification
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-detour-fixture-${{ matrix.arch }}
          path: |
            .zig-cache/o/**/aai-detour-tests
            .zig-cache/o/**/libaai-detour-target.dylib
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
      # The install prefix as scripts/assemble-mac-app.sh expects it.
      - name: Package intermediate build
        run: |
          payload=(macOSLauncher.app bin/stfc-community-mod-loader lib/libstfc-community-mod.dylib)
          if [[ "$GITHUB_REPOSITORY" == Guffawaffle/stfc-mod ]]; then
            payload+=(bin/stfc-profiles share/stfc-profiles)
          fi
          tar -cf macos-${{ matrix.arch }}-build.tar -C zig-out "${payload[@]}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: macos-${{ matrix.arch }}-build.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  attest-win:
    name: attest-win
    needs: build-win
    if: >-
      github.event_name == 'push' &&
      github.repository == 'netniV/stfc-mod' &&
      github.ref_protected &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: windows-2025-vs2026
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download Windows DLL
        uses: actions/download-artifact@v8.0.1
        with:
          name: stfc-community-mod
          path: .artifacts/windows

      - name: Verify DLL provenance
        shell: pwsh
        env:
          STFC_SOURCE_COMMIT: ${{ github.sha }}
          STFC_RUN_ID: ${{ github.run_id }}
          STFC_BUILD_RUN_ATTEMPT: ${{ needs.build-win.outputs.run_attempt }}
        run: |
          $dll = (Resolve-Path -LiteralPath '.artifacts/windows/version.dll').Path
          $commit = $env:STFC_SOURCE_COMMIT
          $runId = $env:STFC_RUN_ID
          $buildAttempt = $env:STFC_BUILD_RUN_ATTEMPT

          if ($commit -notmatch '^[0-9a-f]{40}$') {
            throw "Unable to resolve the workflow commit for DLL provenance."
          }
          if ($runId -notmatch '^[1-9][0-9]*$') {
            throw "Unable to resolve the workflow run ID for DLL provenance."
          }
          if ($buildAttempt -notmatch '^[1-9][0-9]*$') {
            throw "The producing build did not provide a valid run attempt."
          }

          $expected = "stfc-identity-v1;distribution=netniv.stfc-community-mod;source=git:$commit;" +
            "base=$commit;build=github:${runId}:${buildAttempt}:windows;mode=release;channel=ci"
          $comments = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dll).Comments
          if (-not [string]::Equals($comments, $expected, [System.StringComparison]::Ordinal)) {
            throw "DLL provenance mismatch. Expected '$expected'; found '$comments'."
          }
          Write-Host "Verified DLL provenance: $comments"

      - name: Attest Windows DLL
        uses: actions/attest@v4.2.1
        with:
          subject-path: .artifacts/windows/version.dll


  package-mac:
    name: package-mac
    needs: build-mac
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          show-progress: false

      - name: Download ARM64 build
        uses: actions/download-artifact@v8.0.1
        with:
          name: macos-arm64-build
          path: .artifacts/arm64

      - name: Download x86_64 build
        uses: actions/download-artifact@v8.0.1
        with:
          name: macos-x86_64-build
          path: .artifacts/x86_64

      - name: Restore architecture builds
        run: |
          for arch in arm64 x86_64; do
            mkdir -p "zig-out/staging/$arch"
            tar -xf ".artifacts/$arch/macos-$arch-build.tar" -C "zig-out/staging/$arch"
          done

      - name: Assemble universal app bundle
        run: |
          scripts/assemble-mac-app.sh "zig-out/staging/STFC Community Mod.app" \
            zig-out/staging/arm64 zig-out/staging/x86_64
          python3 scripts/verify-version-substitution.py "zig-out/staging/STFC Community Mod.app/Contents/Info.plist" \
            --channel ci --source "${{ github.sha }}"

      - name: Verify universal binaries
        run: |
          set -euo pipefail
          APP="zig-out/staging/STFC Community Mod.app"
          for binary in MacOS/macOSLauncher stfc-community-mod-loader libstfc-community-mod.dylib; do
            archs="$(lipo -archs "$APP/Contents/$binary")"
            echo "$binary: $archs"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          done
          if [[ "$GITHUB_REPOSITORY" == Guffawaffle/stfc-mod ]]; then
            lipo "$APP/Contents/stfc-profiles" -verify_arch arm64 x86_64
            test -s "$APP/Contents/Resources/notices/profiles/source.txt"
          fi

      - name: Install packaging tools
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail

          # zstd is currently preinstalled on the macOS 26 image.
          # Keep the fallback so the workflow remains robust if the
          # runner image changes later.
          command -v zstd >/dev/null 2>&1 || brew install zstd
          command -v create-dmg >/dev/null 2>&1 || brew install create-dmg

      - name: Package macOS mod archive
        run: |
          set -euo pipefail
          mkdir -p stfc-community-mod-macos-universal
          mkdir -p zig-out/standalone
          cp "zig-out/staging/STFC Community Mod.app/Contents/libstfc-community-mod.dylib" zig-out/standalone/
          archive_members=(libstfc-community-mod.dylib)
          if [[ "$GITHUB_REPOSITORY" == Guffawaffle/stfc-mod ]]; then
            cp "zig-out/staging/STFC Community Mod.app/Contents/stfc-profiles" zig-out/standalone/
            cp -R "zig-out/staging/STFC Community Mod.app/Contents/Resources/notices" zig-out/standalone/notices
            archive_members+=(stfc-profiles notices)
          fi
          tar -cf - -C zig-out/standalone "${archive_members[@]}" \
            | zstd -15 -T0 -o stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst
          shasum -a 256 stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst \
            | awk '{print $1}' \
            > stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst.sha256

      - name: Create installer
        run: scripts/create-mac-dmg.sh "zig-out/staging/STFC Community Mod.app" stfc-community-mod-installer.dmg

      - name: Upload installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stfc-community-mod-installer
          path: stfc-community-mod-installer.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Upload macOS mod archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stfc-community-mod-macos-universal
          path: stfc-community-mod-macos-universal
          compression-level: 0
          if-no-files-found: error
