# @file ci.yaml
# @brief CI build workflow — compiles the community patch on Windows and macOS.
#
# Triggers automatically for main branch updates and for reviewable PRs when
# they are opened, updated, reopened, or moved out of draft. Builds release
# artifacts for both platforms using xmake, creates a universal macOS app
# bundle (arm64 + x86_64 via lipo), ad-hoc signs it, and packages a .dmg
# installer. Uploads version.dll (Windows) and the .dmg (macOS) as build
# artifacts.

name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches: ["main", "dev"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      build_class:
        description: Runtime identity class for this build
        required: true
        default: development
        type: choice
        options:
          - development
          - test
      test_target:
        description: Repository, PR, or candidate exercised by a test build
        required: false
        type: string
      test_expiry:
        description: Expiry or supersession condition for a test build
        required: false
        type: string
      support_boundary:
        description: Support owner or channel for a test build
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XMAKE_PACKAGE_CACHE_VERSION: v1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  STFC_CI_BUILD_CLASS: ${{ github.ref_type == 'tag' && 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_class || 'development') }}
  STFC_CI_SOURCE_STATE_ID: git:${{ github.sha }}
  STFC_CI_BASE_COMMIT: ${{ github.sha }}
  STFC_CI_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  STFC_CI_TEST_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.test_target || '' }}
  STFC_CI_TEST_EXPIRY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_expiry || '' }}
  STFC_CI_SUPPORT_BOUNDARY: ${{ github.event_name == 'workflow_dispatch' && inputs.support_boundary || '' }}

# actions/cache@v5 uses Node.js 24 and requires Actions Runner 2.327.1+.
# Every job in this workflow selects a GitHub-hosted runner label.
jobs:
  provider-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test AXF provider contracts
        run: node --test scripts/axf/*.test.mjs

  release-manifest-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate release and runtime identity contracts
        run: >-
          python -m unittest
          tests.test_generate_release_manifest
          tests.test_generate_release_notes
          tests.test_runtime_identity_policy
          -v

  build-win:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Resolve xmake package dir
        id: xmake-package-dir
        shell: pwsh
        run: |
          $dir = xmake l -c "import(""core.package.package""); print(package.installdir())"
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Restore xmake package cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.xmake-package-dir.outputs.dir }}
          key: xmake-packages-${{ env.XMAKE_PACKAGE_CACHE_VERSION }}-win-${{ runner.arch }}-${{ hashFiles('xmake.lua', 'mods/xmake.lua', 'tests/xmake.lua', 'win-proxy-dll/xmake.lua', 'xmake-packages/**/*.lua') }}
          restore-keys: |
            xmake-packages-${{ env.XMAKE_PACKAGE_CACHE_VERSION }}-win-${{ runner.arch }}-

      - name: Test runtime identity build matrix
        shell: pwsh
        run: ./scripts/test_runtime_identity_build.ps1

      - name: Configure
        shell: pwsh
        run: |
          $args = @('f', '-m', 'release', '-y')
          $args += "--stfc_build_class=$env:STFC_CI_BUILD_CLASS"
          $args += "--stfc_source_state_id=$env:STFC_CI_SOURCE_STATE_ID"
          $args += "--stfc_base_commit=$env:STFC_CI_BASE_COMMIT"
          if ('${{ github.event_name }}' -eq 'push' -and ('${{ github.ref }}' -eq 'refs/heads/main' -or '${{ github.ref_type }}' -eq 'tag')) {
            $args += '--stfc_public_release=y'
          }
          if ($env:STFC_CI_RELEASE_TAG) {
            $args += "--stfc_release_tag=$env:STFC_CI_RELEASE_TAG"
          }
          if ($env:STFC_CI_BUILD_CLASS -eq 'test') {
            $args += "--stfc_test_target=$env:STFC_CI_TEST_TARGET"
            $args += "--stfc_test_expiry=$env:STFC_CI_TEST_EXPIRY"
            $args += "--stfc_support_boundary=$env:STFC_CI_SUPPORT_BOUNDARY"
          }
          xmake @args

      - name: Build
        run: xmake -y

      - name: Test
        run: |
          node --test scripts/test_config_schema.mjs
          node --test scripts/test_battle_bridge_producer_contract.mjs
          node scripts/generate_config_schema.mjs --check
          xmake build stfc-mod-tests
          xmake run stfc-mod-tests

      - name: Package
        shell: pwsh
        run: |
          Move-Item build/windows/x64/release/stfc-community-mod.dll version.dll
          node scripts/generate_battle_bridge_runtime_manifest.mjs `
            --dll version.dll `
            --output stfc-runtime-manifest.json `
            --source-revision ${{ github.sha }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'stfc-community-mod-unsigned' || 'stfc-community-mod' }}
          path: |
            version.dll
            stfc-runtime-manifest.json
          if-no-files-found: error

  launcher-win:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore launcher
        run: dotnet restore windows-launcher/STFCCommunityMod.Launcher.sln

      - name: Build and test launcher
        run: dotnet test windows-launcher/STFCCommunityMod.Launcher.sln -c Release --no-restore

      - name: Publish self-contained launcher
        shell: pwsh
        run: |
          ./windows-launcher/scripts/publish.ps1 `
            -OutputDirectory "${{ runner.temp }}/stfc-community-mod-launcher"

      - name: Upload launcher spike artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'stfc-community-mod-launcher-win-x64-unsigned' || 'stfc-community-mod-launcher-win-x64' }}
          path: ${{ runner.temp }}/stfc-community-mod-launcher
          if-no-files-found: error

  sign-windows-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-win
      - launcher-win
    runs-on: windows-2025
    environment:
      name: windows-release
    permissions:
      contents: read
      id-token: write
    env:
      WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
      AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
    steps:
      - name: Checkout signing and packaging policy
        uses: actions/checkout@v6

      - name: Setup .NET 8 for signed bootstrapper build
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Download unsigned Windows mod
        uses: actions/download-artifact@v8
        with:
          name: stfc-community-mod-unsigned
          path: ${{ runner.temp }}/stfc-community-mod

      - name: Download unsigned Windows launcher
        uses: actions/download-artifact@v8
        with:
          name: stfc-community-mod-launcher-win-x64-unsigned
          path: ${{ runner.temp }}/stfc-community-mod-launcher

      - name: Validate signing inputs
        shell: pwsh
        run: |
          $required = @(
            "WIN_PUBLISHER_NAME",
            "AZURE_TRUSTED_SIGNING_ENDPOINT",
            "AZURE_CODE_SIGNING_ACCOUNT_NAME",
            "AZURE_CERTIFICATE_PROFILE_NAME"
          )
          $missing = @($required | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) {
            throw "Missing signing environment values: $($missing -join ', ')"
          }

          $files = @(
            "${{ runner.temp }}/stfc-community-mod/version.dll",
            "${{ runner.temp }}/stfc-community-mod-launcher/app/STFCCommunityMod.Launcher.exe",
            "${{ runner.temp }}/stfc-community-mod-launcher/app/STFCCommunityMod.Launcher.Updater.exe"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Expected signing input was not found: $file"
            }
          }

      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows mod DLL
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ runner.temp }}/stfc-community-mod
          files-folder-filter: dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: STFC Community Mod
          description-url: https://github.com/Guffawaffle/stfc-mod

      - name: Sign Windows launcher
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ runner.temp }}/stfc-community-mod-launcher/app
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: STFC Community Mod Launcher
          description-url: https://github.com/Guffawaffle/stfc-mod

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool) {
            throw "signtool.exe was not found"
          }

          $files = @(
            "${{ runner.temp }}/stfc-community-mod/version.dll",
            "${{ runner.temp }}/stfc-community-mod-launcher/app/STFCCommunityMod.Launcher.exe",
            "${{ runner.temp }}/stfc-community-mod-launcher/app/STFCCommunityMod.Launcher.Updater.exe"
          )
          foreach ($file in $files) {
            & $signtool verify /pa /v $file
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verification failed for $file"
            }

            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne "Valid") {
              throw "Authenticode status was $($signature.Status) for $file"
            }
            if (-not $signature.SignerCertificate.Subject.StartsWith(
                "CN=$env:WIN_PUBLISHER_NAME,",
                [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Unexpected Authenticode publisher for $file"
            }
          }

      - name: Bind runtime capability manifest to signed DLL
        shell: pwsh
        run: |
          node scripts/generate_battle_bridge_runtime_manifest.mjs `
            --dll "${{ runner.temp }}/stfc-community-mod/version.dll" `
            --output "${{ runner.temp }}/stfc-community-mod/stfc-runtime-manifest.json" `
            --source-revision ${{ github.sha }}

      - name: Package signed launcher
        shell: pwsh
        run: |
          ./windows-launcher/scripts/package.ps1 `
            -OutputDirectory "${{ runner.temp }}/stfc-community-mod-launcher"

      - name: Build launcher setup from signed payload
        shell: pwsh
        run: |
          ./windows-launcher/scripts/publish-bootstrapper.ps1 `
            -OutputDirectory "${{ runner.temp }}/stfc-community-mod-launcher"

      - name: Sign Windows launcher setup
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ runner.temp }}/stfc-community-mod-launcher/setup
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: STFC Community Mod Launcher Setup
          description-url: https://github.com/Guffawaffle/stfc-mod

      - name: Verify launcher setup signature
        shell: pwsh
        run: |
          $setup = "${{ runner.temp }}/stfc-community-mod-launcher/setup/STFCCommunityMod.Launcher.Setup.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw "Expected launcher setup was not found: $setup"
          }
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool) {
            throw "signtool.exe was not found"
          }
          & $signtool verify /pa /v $setup
          if ($LASTEXITCODE -ne 0) {
            throw "signtool verification failed for $setup"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne "Valid") {
            throw "Authenticode status was $($signature.Status) for $setup"
          }
          if (-not $signature.SignerCertificate.Subject.StartsWith(
              "CN=$env:WIN_PUBLISHER_NAME,",
              [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Unexpected Authenticode publisher for $setup"
          }

      - name: Upload signed Windows mod
        uses: actions/upload-artifact@v7
        with:
          name: stfc-community-mod
          path: |
            ${{ runner.temp }}/stfc-community-mod/version.dll
            ${{ runner.temp }}/stfc-community-mod/stfc-runtime-manifest.json
          if-no-files-found: error

      - name: Upload signed Windows launcher
        uses: actions/upload-artifact@v7
        with:
          name: stfc-community-mod-launcher-win-x64
          path: ${{ runner.temp }}/stfc-community-mod-launcher
          if-no-files-found: error

  build-mac:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Resolve xmake package dir
        id: xmake-package-dir
        shell: bash
        run: |
          dir="$(xmake l -c 'import("core.package.package"); print(package.installdir())')"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Restore xmake package cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.xmake-package-dir.outputs.dir }}
          key: xmake-packages-${{ env.XMAKE_PACKAGE_CACHE_VERSION }}-mac-${{ runner.arch }}-${{ hashFiles('xmake.lua', 'mods/xmake.lua', 'tests/xmake.lua', 'macos-dylib/xmake.lua', 'macos-loader/xmake.lua', 'macos-launcher/xmake.lua', 'xmake-packages/**/*.lua') }}
          restore-keys: |
            xmake-packages-${{ env.XMAKE_PACKAGE_CACHE_VERSION }}-mac-${{ runner.arch }}-

      - name: Configure (arm64)
        shell: bash
        run: |
          args=(f -p macosx -a arm64 -m release -y --target_minver=13.5)
          args+=(--stfc_build_class="$STFC_CI_BUILD_CLASS")
          args+=(--stfc_source_state_id="$STFC_CI_SOURCE_STATE_ID")
          args+=(--stfc_base_commit="$STFC_CI_BASE_COMMIT")
          if [[ "${{ github.event_name }}" == "push" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref_type }}" == "tag" ) ]]; then
            args+=(--stfc_public_release=y)
          fi
          if [[ -n "$STFC_CI_RELEASE_TAG" ]]; then
            args+=(--stfc_release_tag="$STFC_CI_RELEASE_TAG")
          fi
          if [[ "$STFC_CI_BUILD_CLASS" == "test" ]]; then
            args+=(--stfc_test_target="$STFC_CI_TEST_TARGET")
            args+=(--stfc_test_expiry="$STFC_CI_TEST_EXPIRY")
            args+=(--stfc_support_boundary="$STFC_CI_SUPPORT_BOUNDARY")
          fi
          xmake "${args[@]}"

      - name: Build (arm64)
        run: xmake -y

      - name: Configure (x86)
        shell: bash
        run: |
          args=(f -p macosx -a x86_64 -m release -y --target_minver=13.5)
          args+=(--stfc_build_class="$STFC_CI_BUILD_CLASS")
          args+=(--stfc_source_state_id="$STFC_CI_SOURCE_STATE_ID")
          args+=(--stfc_base_commit="$STFC_CI_BASE_COMMIT")
          if [[ "${{ github.event_name }}" == "push" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref_type }}" == "tag" ) ]]; then
            args+=(--stfc_public_release=y)
          fi
          if [[ -n "$STFC_CI_RELEASE_TAG" ]]; then
            args+=(--stfc_release_tag="$STFC_CI_RELEASE_TAG")
          fi
          if [[ "$STFC_CI_BUILD_CLASS" == "test" ]]; then
            args+=(--stfc_test_target="$STFC_CI_TEST_TARGET")
            args+=(--stfc_test_expiry="$STFC_CI_TEST_EXPIRY")
            args+=(--stfc_support_boundary="$STFC_CI_SUPPORT_BOUNDARY")
          fi
          xmake "${args[@]}"

      - name: Build (x86)
        run: xmake -y

      - name: Rebuild launcher assets
        shell: bash
        run: |
          args=(f -p macosx -a arm64 -m release -y --target_minver=13.5)
          args+=(--stfc_build_class="$STFC_CI_BUILD_CLASS")
          args+=(--stfc_source_state_id="$STFC_CI_SOURCE_STATE_ID")
          args+=(--stfc_base_commit="$STFC_CI_BASE_COMMIT")
          if [[ "${{ github.event_name }}" == "push" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref_type }}" == "tag" ) ]]; then
            args+=(--stfc_public_release=y)
          fi
          if [[ -n "$STFC_CI_RELEASE_TAG" ]]; then
            args+=(--stfc_release_tag="$STFC_CI_RELEASE_TAG")
          fi
          if [[ "$STFC_CI_BUILD_CLASS" == "test" ]]; then
            args+=(--stfc_test_target="$STFC_CI_TEST_TARGET")
            args+=(--stfc_test_expiry="$STFC_CI_TEST_EXPIRY")
            args+=(--stfc_support_boundary="$STFC_CI_SUPPORT_BOUNDARY")
          fi
          xmake "${args[@]}"
          xmake -r -y macOSLauncher
          test -f build/macosx/arm64/release/macOSLauncher.app/Contents/Resources/Assets.car

      - name: Create App Bundle
        run: |
          lipo -create build/macosx/arm64/release/macOSLauncher build/macosx/x86_64/release/macOSLauncher -output build/macosx/arm64/release/macOSLauncher.app/Contents/MacOS/macOSLauncher
          lipo -create build/macosx/arm64/release/stfc-community-mod-loader build/macosx/x86_64/release/stfc-community-mod-loader -output build/macosx/arm64/release/macOSLauncher.app/Contents/stfc-community-mod-loader
          lipo -create build/macosx/arm64/release/libstfc-community-mod.dylib build/macosx/x86_64/release/libstfc-community-mod.dylib -output build/macosx/arm64/release/macOSLauncher.app/Contents/libstfc-community-mod.dylib
          cp assets/launcher.icns build/macosx/arm64/release/macOSLauncher.app/Contents/Resources/
          cp macos-launcher/src/Info.plist build/macosx/arm64/release/macOSLauncher.app/Contents/
          mv build/macosx/arm64/release/macOSLauncher.app build/macosx/arm64/release/STFC\ Community\ Mod.app
          test -f build/macosx/arm64/release/STFC\ Community\ Mod.app/Contents/Resources/Assets.car

      - name: Sign App Bundle
        run: codesign --force --verify --verbose --deep --sign "-" build/macosx/arm64/release/STFC\ Community\ Mod.app

      - name: Package macOS mod archive
        run: |
          brew install zstd
          mkdir -p stfc-community-mod-macos-universal
          tar -cf - \
            -C build/macosx/arm64/release/STFC\ Community\ Mod.app/Contents \
            libstfc-community-mod.dylib \
            | zstd -19 -T0 -o stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst
          shasum -a 256 stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst \
            | awk '{print $1}' \
            > stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst.sha256

      - name: Install disk image creation tool
        run: brew install create-dmg

      - name: Create installer
        run: create-dmg --filesystem APFS --format ULFO --volname "STFC Community Mod Installer" --volicon assets/launcher.icns --background assets/mac_installer_background.png --window-pos 200 120 --window-size 800 400 --icon-size 100 --icon "STFC Community Mod.app" 200 190 --app-drop-link 600 185 stfc-community-mod-installer.dmg build/macosx/arm64/release/

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: stfc-community-mod-installer
          path: stfc-community-mod-installer.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Upload macOS mod archive
        uses: actions/upload-artifact@v7
        with:
          name: stfc-community-mod-macos-universal
          path: stfc-community-mod-macos-universal
          compression-level: 0
          if-no-files-found: error
