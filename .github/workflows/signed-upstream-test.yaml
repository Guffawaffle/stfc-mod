name: Signed artifact gallery PR test

on:
  push:
    tags: ["v*-pr303.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: signed-pr303-${{ github.ref }}
  cancel-in-progress: false

env:
  PR_HEAD: eab5a833e571104f83d8efd6db620990590c10da
  PR_BASE: 4bf238c116ebc6300ee33c792117f06dd7c22199
  BUILD_COMMIT: 894dd38b37c1ea0ebc7e52dae6faf154163ac90a
  UPSTREAM_RUN_ID: "35657088968"
  UNSIGNED_SHA256: ff0f964cf4280be1a223648ae13c10ea348cc40893107e016799bb4b029465fe

jobs:
  prepare:
    if: github.repository == 'Guffawaffle/stfc-mod'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download and verify the pinned PR artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REF_TYPE -ne 'tag' -or $env:RELEASE_TAG -cne 'v1.1.8.0-pr303.1') {
            throw 'This one-off workflow only publishes v1.1.8.0-pr303.1.'
          }
          $runJson = gh api "repos/netniV/stfc-mod/actions/runs/$env:UPSTREAM_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read upstream run.' }
          $run = $runJson | ConvertFrom-Json
          if ($run.repository.full_name -cne 'netniV/stfc-mod' -or $run.head_sha -cne $env:PR_HEAD -or
              $run.event -ne 'pull_request' -or $run.head_branch -ne 'fix/artifact-gallery-crash' -or
              $run.run_attempt -ne 1 -or
              $run.path -ne '.github/workflows/ci.yaml') {
            throw 'Run must be the pinned upstream PR build.'
          }
          $jobsJson = gh api "repos/netniV/stfc-mod/actions/runs/$env:UPSTREAM_RUN_ID/attempts/1/jobs?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read pinned build jobs.' }
          $jobs = $jobsJson | ConvertFrom-Json
          $windows = @($jobs.jobs | Where-Object { $_.name -ceq 'build-win' })
          if ($windows.Count -ne 1 -or $windows[0].status -ne 'completed' -or
              $windows[0].conclusion -ne 'success') {
            throw 'The pinned Windows build must pass before signing.'
          }
          foreach ($requiredStep in @('Test x64 trampoline relocation', 'Verify DLL provenance', 'Upload')) {
            $step = @($windows[0].steps | Where-Object { $_.name -ceq $requiredStep })
            if ($step.Count -ne 1 -or $step[0].conclusion -ne 'success') {
              throw "Required Windows validation step did not pass: $requiredStep"
            }
          }
          $prJson = gh api repos/netniV/stfc-mod/pulls/303
          if ($LASTEXITCODE -ne 0) { throw 'Could not read upstream PR.' }
          $pr = $prJson | ConvertFrom-Json
          if ($pr.head.sha -cne $env:PR_HEAD -or $pr.head.repo.full_name -cne 'Guffawaffle/stfc-mod' -or
              $pr.base.ref -ne 'main' -or $pr.base.sha -cne $env:PR_BASE) {
            throw 'PR source/base changed since review.'
          }
          New-Item -ItemType Directory -Path payload | Out-Null
          gh run download $env:UPSTREAM_RUN_ID --repo netniV/stfc-mod --name stfc-community-mod --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'PR artifact download failed.' }
          $files = @(Get-ChildItem payload -Recurse -Force -File)
          if ($files.Count -ne 1 -or $files[0].FullName -ne (Join-Path $PWD 'payload/version.dll')) {
            throw 'Expected exactly one version.dll in the PR artifact.'
          }
          $hash = (Get-FileHash payload/version.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne $env:UNSIGNED_SHA256) { throw 'PR artifact hash mismatch.' }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path payload/version.dll))
          $expected = "stfc-identity-v1;distribution=netniv.stfc-community-mod;source=git:$env:BUILD_COMMIT;" +
            "base=$env:BUILD_COMMIT;build=github:$($env:UPSTREAM_RUN_ID):1:windows;mode=release;channel=ci"
          if ($info.Comments -cne $expected -or $info.FileVersion -cne '1.1.8.0') {
            throw 'PR DLL embedded build identity/version mismatch.'
          }
          # Pull-request builds do not receive upstream main/dev attestations.
          # Bind this release to the reviewed PR, CI merge commit, run, and independently checked hash.
          [ordered]@{
            upstreamRepository = 'netniV/stfc-mod'
            pullRequest = 303
            pullRequestUrl = 'https://github.com/netniV/stfc-mod/pull/303'
            pullRequestHead = $env:PR_HEAD
            pullRequestBase = $env:PR_BASE
            upstreamCommit = $env:BUILD_COMMIT
            upstreamRunId = $env:UPSTREAM_RUN_ID
            upstreamRunUrl = $run.html_url
            upstreamVersion = $info.FileVersion
            unsignedSha256 = $hash
            provenanceVerification = 'pinned PR head/base, CI run, embedded merge identity, and SHA256; no upstream attestation'
          } | ConvertTo-Json | Set-Content payload/provenance.json -Encoding utf8NoBOM
          "Verified PR #303 head: $env:PR_HEAD`nUnsigned DLL SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Retain verified unsigned input
        uses: actions/upload-artifact@v7.0.1
        with:
          name: upstream-signing-input
          path: payload/
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 15
    environment: windows-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: upstream-signing-input
          path: payload

      - name: Azure login with existing release identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign upstream DLL
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\payload\version.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: STFC Community Mod - artifact gallery hotfix PR 303
          description-url: https://github.com/Guffawaffle/stfc-mod

      - name: Verify signature and package test release
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.WIN_PUBLISHER_NAME }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sig = Get-AuthenticodeSignature -LiteralPath payload/version.dll
          if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) {
            throw 'A valid, timestamped Authenticode signature is required.'
          }
          $cert = $sig.SignerCertificate
          $publisher = $cert.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if (-not $env:EXPECTED_PUBLISHER -or $publisher -cne $env:EXPECTED_PUBLISHER) {
            throw "Unexpected signing publisher '$publisher'."
          }
          $rsa = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($cert)
          if (-not $rsa -or $rsa.KeySize -gt 4096 -or $rsa.KeySize -lt 2048) {
            throw 'Expected an RSA code-signing certificate supported by Smart App Control.'
          }
          # Use the typed extension to require the Azure Public Trust marker.
          $oids = @($cert.Extensions | Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
            ForEach-Object { $_.EnhancedKeyUsages | ForEach-Object Value })
          if ('1.3.6.1.4.1.311.97.1.0' -notin $oids -or '1.3.6.1.5.5.7.3.3' -notin $oids) {
            throw 'Expected Azure Public Trust code-signing certificate EKUs.'
          }
          $provenance = Get-Content payload/provenance.json -Raw | ConvertFrom-Json -AsHashtable
          $provenance.signedSha256 = (Get-FileHash payload/version.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $provenance.signer = $publisher
          $provenance.certificateThumbprint = $cert.Thumbprint
          $provenance.keyAlgorithm = 'RSA'
          $provenance.keySize = $rsa.KeySize
          $rsa.Dispose()
          $provenance.signingWorkflowCommit = $env:GITHUB_SHA
          $provenance.signingRunUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $provenance | ConvertTo-Json | Set-Content payload/provenance.json -Encoding utf8NoBOM
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item payload/version.dll, payload/provenance.json -Destination release
          Compress-Archive -LiteralPath payload/version.dll -DestinationPath release/stfc-community-mod-signed-test.zip
          Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
          @"
          Artifact gallery crash fix — signed Windows x64 test build of upstream PR #303.

          PR: $($provenance.pullRequestUrl)
          Reviewed PR head: $($provenance.pullRequestHead)
          CI merge commit: $($provenance.upstreamCommit)
          Upstream build: $($provenance.upstreamRunUrl)
          Publisher: $publisher (RSA $($provenance.keySize), valid Authenticode signature and timestamp).

          Based on upstream main plus PR #303, which fixes the artifact-gallery crash in x64 hook relocation.
          Gallery opening and detail-view arrow navigation were tested on client build 263.
          The Windows CI build and native relocation regression passed. macOS checks remain tracked on the PR.
          This is a PR test build, not an official upstream release or the combined fork feature stack.
          The CI artifact is pinned by SHA-256 and embedded identity; PR builds have no upstream attestation.
          The release tag identifies the signing workflow, not the upstream source commit.

          Close the game, back up your existing version.dll, then replace it with version.dll from this release
          (also included in stfc-community-mod-signed-test.zip). Leave Smart App Control enabled and launch normally.
          Test opening the artifact gallery and navigating artifact details with Left/Right.
          If Windows blocks loading, include the CodeIntegrity event naming the blocked file.
          Restore the backup to undo the test. Automatic updates may replace this test DLL.

          Signed DLL SHA-256: $($provenance.signedSha256)
          "@ | Set-Content release/RELEASE_NOTES.md -Encoding utf8NoBOM

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: signed-upstream-test
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: signed-upstream-test
          path: release
      - name: Publish test prerelease without changing latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
            --title "Artifact gallery crash fix (signed Windows): $RELEASE_TAG" \
            --notes-file release/RELEASE_NOTES.md \
            release/version.dll release/stfc-community-mod-signed-test.zip \
            release/provenance.json release/SHA256SUMS.txt
