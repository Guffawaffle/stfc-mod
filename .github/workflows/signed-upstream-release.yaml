name: Signed pan-controls preview
'on':
  push:
    tags:
    - v1.1.11.1-guffa.signed.1
  workflow_dispatch: null
permissions: {}
concurrency:
  group: signed-upstream-release-windows-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_COMMIT: c1d3cbc95247487f986d04b3601c4597a3aa93be
  BUILD_RUN_ID: '43450275282'
  UNSIGNED_SHA256: 16b01420736b67d62fc1e982737ec33070215bd37adc904909ca69dbb0d9d249
  RELEASE_TAG: v1.1.11.1-guffa.signed.1
  SOURCE_REPOSITORY: STFC-Mod/mod
  HEAD_REPOSITORY: Guffawaffle/stfc-mod
  UPSTREAM_BASE_COMMIT: 9f8bae21e8fb2abc6564ece9233cef675fd35a14
  SOURCE_SHA: c1d3cbc95247487f986d04b3601c4597a3aa93be
  SOURCE_BRANCH: science/system-pan-controls
  CI_HEAD_SHA: 0e83a9a643216a8ca1a7a7036750106bddf4eae4
  INPUT_DMG_SHA256: 080e4037e4b60dfd44c621914997171a4efca6de9f97d29f79a526ea414d3ac7
jobs:
  prepare:
    if: github.repository == 'Guffawaffle/stfc-mod'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - name: Download and verify exact pan-controls CI artifact
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:REF_TYPE -ne 'tag' -or $env:RELEASE_TAG -cne 'v1.1.11.1-guffa.signed.1') {
          throw 'This one-off workflow only publishes v1.1.11.1-guffa.signed.1 from its tag.'
        }
        if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or $env:BUILD_RUN_ID -notmatch '^[1-9][0-9]*$') {
          throw 'An exact source commit and numeric workflow run ID are required.'
        }
        $runJson = gh api "repos/STFC-Mod/mod/actions/runs/$env:BUILD_RUN_ID"
        if ($LASTEXITCODE -ne 0) { throw 'Could not read upstream run.' }
        $run = $runJson | ConvertFrom-Json
        if ($run.repository.full_name -cne 'STFC-Mod/mod' -or $run.head_sha -cne $env:CI_HEAD_SHA -or
            $run.head_repository.full_name -cne $env:HEAD_REPOSITORY -or
            $run.event -ne 'pull_request' -or $run.head_branch -cne $env:SOURCE_BRANCH -or
            $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or
            $run.run_attempt -ne 1 -or $run.path -ne '.github/workflows/ci.yaml') {
          throw 'Run must be the pinned successful upstream PR362 build from the pinned fork head.'
        }
        $jobsJson = gh api "repos/STFC-Mod/mod/actions/runs/$env:BUILD_RUN_ID/attempts/1/jobs?per_page=100"
        if ($LASTEXITCODE -ne 0) { throw 'Could not read pinned build jobs.' }
        $jobs = $jobsJson | ConvertFrom-Json
        foreach ($jobName in @('build-win', 'build-mac (x86_64)', 'build-mac (arm64)')) {
          $job = @($jobs.jobs | Where-Object { $_.name -ceq $jobName })
          if ($job.Count -ne 1 -or $job[0].conclusion -ne 'success') {
            throw "Pinned validation job did not pass: $jobName"
          }
        }
        New-Item -ItemType Directory -Path payload | Out-Null
        gh run download $env:BUILD_RUN_ID --repo STFC-Mod/mod --name stfc-community-mod --dir payload
        if ($LASTEXITCODE -ne 0) { throw 'Upstream artifact download failed.' }
        $files = @(Get-ChildItem payload -Recurse -Force -File)
        if ($files.Count -ne 1 -or $files[0].FullName -ne (Join-Path $PWD 'payload/version.dll')) {
          throw 'Expected exactly one version.dll in the upstream artifact.'
        }
        # This upstream PR run has no attestation. Pin repository/run/attempt, identity, and SHA256.
        $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path payload/version.dll))
        $version = $info.FileVersion
        $expected = "stfc-identity-v1;distribution=netniv.stfc-community-mod;source=git:$env:SOURCE_COMMIT;" +
          "base=$env:SOURCE_COMMIT;build=github:$($env:BUILD_RUN_ID):1:windows;mode=release;channel=ci"
        if ($version -cne '1.1.11.1' -or $info.Comments -cne $expected) {
          throw 'Upstream DLL embedded build identity/version mismatch.'
        }
        $hash = (Get-FileHash payload/version.dll -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($hash -cne $env:UNSIGNED_SHA256) { throw 'Pinned upstream DLL hash mismatch.' }
        [ordered]@{
          upstreamRepository = 'STFC-Mod/mod'
          upstreamBaseline = 'dev'
          upstreamBaselineCommit = $env:UPSTREAM_BASE_COMMIT
          candidateRepository = $env:HEAD_REPOSITORY
          candidateCommit = $env:CI_HEAD_SHA
          pullRequest = 'https://github.com/STFC-Mod/mod/pull/362'
          sourceRepository = 'STFC-Mod/mod'
          sourceBranch = $env:SOURCE_BRANCH
          sourceCommit = $env:SOURCE_COMMIT
          buildHeadCommit = $env:CI_HEAD_SHA
          buildRunId = $env:BUILD_RUN_ID
          buildRunUrl = $run.html_url
          dllVersion = $version
          embeddedBuildIdentity = $info.Comments
          provenanceVerification = 'pinned payload SHA256, upstream PR362 build/attempt, and embedded merge-snapshot identity; upstream attestation job skipped'
          unsignedSha256 = $hash
        } | ConvertTo-Json | Set-Content payload/provenance.json -Encoding utf8NoBOM
        "Verified upstream commit: $env:SOURCE_COMMIT`nUnsigned DLL SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
    - name: Retain verified unsigned input
      uses: actions/upload-artifact@v7.0.1
      with:
        name: upstream-signing-input
        path: payload/
        if-no-files-found: error
        retention-days: 7
  sign:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 15
    environment: windows-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
    - uses: actions/download-artifact@v8.0.1
      with:
        name: upstream-signing-input
        path: payload
    - name: Azure login with existing release identity
      uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - name: Sign upstream DLL
      uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82
      with:
        endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
        certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
        files: ${{ github.workspace }}\payload\version.dll
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        description: STFC Community Mod - pan-controls preview 1.1.11.1
        description-url: https://github.com/Guffawaffle/stfc-mod
    - name: Verify signature and package test release
      shell: pwsh
      env:
        EXPECTED_PUBLISHER: ${{ vars.WIN_PUBLISHER_NAME }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        $ErrorActionPreference = 'Stop'
        $sig = Get-AuthenticodeSignature -LiteralPath payload/version.dll
        if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) {
          throw 'A valid, timestamped Authenticode signature is required.'
        }
        $cert = $sig.SignerCertificate
        $publisher = $cert.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
        if (-not $env:EXPECTED_PUBLISHER -or $publisher -cne $env:EXPECTED_PUBLISHER) {
          throw "Unexpected signing publisher '$publisher'."
        }
        $rsa = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($cert)
        if (-not $rsa -or $rsa.KeySize -gt 4096 -or $rsa.KeySize -lt 2048) {
          throw 'Expected an RSA code-signing certificate supported by Smart App Control.'
        }
        # Use the typed extension to require the Azure Public Trust marker.
        $oids = @($cert.Extensions | Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
          ForEach-Object { $_.EnhancedKeyUsages | ForEach-Object Value })
        if ('1.3.6.1.4.1.311.97.1.0' -notin $oids -or '1.3.6.1.5.5.7.3.3' -notin $oids) {
          throw 'Expected Azure Public Trust code-signing certificate EKUs.'
        }
        $provenance = Get-Content payload/provenance.json -Raw | ConvertFrom-Json -AsHashtable
        $provenance.signedSha256 = (Get-FileHash payload/version.dll -Algorithm SHA256).Hash.ToLowerInvariant()
        $provenance.signer = $publisher
        $provenance.certificateThumbprint = $cert.Thumbprint
        $provenance.keyAlgorithm = 'RSA'
        $provenance.keySize = $rsa.KeySize
        $rsa.Dispose()
        $provenance.signingWorkflowCommit = $env:GITHUB_SHA
        $provenance.signingRunUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
        $provenance | ConvertTo-Json | Set-Content payload/provenance.json -Encoding utf8NoBOM
        New-Item -ItemType Directory -Path release | Out-Null
        Copy-Item payload/version.dll, payload/provenance.json -Destination release
        Compress-Archive -LiteralPath payload/version.dll -DestinationPath release/stfc-community-mod-signed.zip
        Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
          '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
        } | Set-Content release/SHA256SUMS.txt -Encoding ascii
        @"
        A signed preview of upstream development version 1.1.11.1 with [pan speed and momentum controls](https://github.com/STFC-Mod/mod/pull/362).

        Keeps the double-movement drag fix and makes speed and release glide consistent for mouse/touch and keyboard panning.
        Under [graphics] in community_patch_settings.toml:

            system_pan_speed = 1.0
            system_pan_momentum_falloff = 0.8

        Speed: 1.0 is normal, 0.5 is half speed, 1.5 is 50% faster. Falloff: lower values stop sooner; higher values glide longer (0 = immediate stop, 1 = no decay). Existing falloff settings are preserved. The unused system_pan_momentum setting is retired.

        Windows: close the game and replace version.dll using the DLL or ZIP below. Back up your current DLL first.
        Mac: use the signed, notarized and stapled installer DMG for Intel or Apple Silicon. The universal archive contains the same signed library.

        Windows gameplay was tested before signing. Mac gameplay feedback is welcome.
        This is a community preview on Guffawaffle's fork, separate from the official upstream release.

        Candidate: $($provenance.candidateCommit)
        Build snapshot: $($provenance.sourceCommit)
        Upstream CI: $($provenance.buildRunUrl)
        Publisher: $publisher (timestamped Authenticode); Mac: Developer ID signing and Apple notarization.
        Provenance and SHA256SUMS.txt identify the delivered files; the release tag identifies the signing workflow.
        "@ | Set-Content release/RELEASE_NOTES.md -Encoding utf8NoBOM
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: signed-upstream-release-windows
        path: release/
        if-no-files-found: error
        retention-days: 30
  publish:
    needs:
    - sign
    - sign-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/download-artifact@v8.0.1
      with:
        name: signed-upstream-release-windows
        path: release
    - uses: actions/download-artifact@v8.0.1
      with:
        name: signed-upstream-release-macos
        path: release
    - name: Publish signed Windows and Mac prerelease without changing latest
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        cd release
        rm SHA256SUMS.txt
        sha256sum version.dll stfc-community-mod-signed.zip provenance.json \
          stfc-community-mod-installer.dmg stfc-community-mod-macos-universal.tar.zst \
          stfc-community-mod-macos-universal.tar.zst.sha256 macos-provenance.json > SHA256SUMS.txt
        gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
          --title "Pan speed controls - signed preview (Windows + Mac)" \
          --notes-file RELEASE_NOTES.md \
          version.dll stfc-community-mod-signed.zip provenance.json SHA256SUMS.txt \
          stfc-community-mod-installer.dmg stfc-community-mod-macos-universal.tar.zst \
          stfc-community-mod-macos-universal.tar.zst.sha256 macos-provenance.json
  sign-macos:
    if: github.repository == 'Guffawaffle/stfc-mod'
    runs-on: macos-26
    timeout-minutes: 60
    environment: macos-release
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Verify pinned successful upstream build
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == refs/tags/v1.1.11.1-guffa.signed.1 ]]
        gh api "repos/$SOURCE_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/mac-build.json"
        jq -e --arg sha "$CI_HEAD_SHA" --arg repo "$SOURCE_REPOSITORY" --arg branch "$SOURCE_BRANCH" --arg headRepo "$HEAD_REPOSITORY" '
          .head_sha == $sha and .head_branch == $branch and .event == "pull_request" and
          .status == "completed" and .conclusion == "success" and .run_attempt == 1 and
          .path == ".github/workflows/ci.yaml" and .repository.full_name == $repo and .head_repository.full_name == $headRepo
        ' "$RUNNER_TEMP/mac-build.json"
        gh api "repos/$SOURCE_REPOSITORY/actions/runs/$BUILD_RUN_ID/attempts/1/jobs?per_page=100" > "$RUNNER_TEMP/mac-jobs.json"
        for job in 'build-mac (arm64)' 'build-mac (x86_64)' package-mac; do
          jq -e --arg job "$job" '[.jobs[] | select(.name == $job and .conclusion == "success")] | length == 1' "$RUNNER_TEMP/mac-jobs.json"
        done
    - name: Download pinned source installer
      uses: actions/download-artifact@v8.0.1
      with:
        name: stfc-community-mod-installer
        path: unsigned-macos
        github-token: ${{ github.token }}
        repository: STFC-Mod/mod
        run-id: '43450275282'
    - name: Check exact installer hash before accessing signing identity
      shell: bash
      run: |
        set -euo pipefail
        [[ "$(find unsigned-macos -type f | wc -l | tr -d ' ')" == 1 ]]
        [[ "$(shasum -a 256 unsigned-macos/stfc-community-mod-installer.dmg | awk '{print $1}')" == "$INPUT_DMG_SHA256" ]]
    - name: Install archive tool
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: command -v zstd >/dev/null || brew install zstd
    - name: Sign and notarize exact universal installer
      shell: bash
      env:
        MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_ID: ${{ vars.APPLE_ID }}
        APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      run: bash scripts/sign-upstream-release-macos.sh
    - name: Remove temporary signing keychain
      if: always()
      shell: bash
      run: |
        if [[ -f "$RUNNER_TEMP/stfc-signing.keychain-db" ]]; then
          security delete-keychain "$RUNNER_TEMP/stfc-signing.keychain-db"
        fi
    - name: Retain notarization evidence and exact submitted payload
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: upstream-release-macos-notarization
        path: |
          macos-notarization-evidence/
          macos-notarization-payloads/
        if-no-files-found: ignore
        retention-days: 30
    - name: Retain verified signed Mac downloads
      uses: actions/upload-artifact@v7.0.1
      with:
        name: signed-upstream-release-macos
        path: signed-macos/
        if-no-files-found: error
        retention-days: 30
