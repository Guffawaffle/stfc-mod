name: Profiles test preview

on:
  push:
    branches: [preview/profiles-net]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: profiles-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"
  UPSTREAM_BASE: cd1ef0c1731b911950e59561c8a8bbea8fa1a7a2

jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: "3.0.8"
      - name: Stamp source
        run: python scripts/stamp-version-hash.py "${{ github.sha }}"
      - name: Build matching runtime and helper
        shell: pwsh
        run: |
          zig build install -Dprofiles=true -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast `
            "-Dstfc_source_state_id=git:${{ github.sha }}" `
            "-Dstfc_base_commit=${{ env.UPSTREAM_BASE }}" `
            "-Dstfc_build_invocation_id=github:${{ github.run_id }}:${{ github.run_attempt }}:windows" `
            -Dstfc_build_channel=ci --summary all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify binary contract
        run: >-
          python scripts/verify-windows-binary.py --profiles --identity
          "stfc-identity-v1;distribution=netniv.stfc-community-mod;source=git:${{ github.sha }};base=${{ env.UPSTREAM_BASE }};build=github:${{ github.run_id }}:${{ github.run_attempt }}:windows;mode=release;channel=ci"
      - name: Package Windows preview
        shell: pwsh
        run: |
          python scripts/package-profiles-preview.py --platform windows --prefix zig-out `
            --output profiles-preview-windows --source "${{ github.sha }}" --base "${{ env.UPSTREAM_BASE }}" `
            --run "${{ github.run_id }}:${{ github.run_attempt }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -LiteralPath profiles-preview-windows -DestinationPath profiles-preview-windows.zip
          (Get-FileHash profiles-preview-windows.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content profiles-preview-windows.zip.sha256
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: profiles-preview-windows
          path: |
            profiles-preview-windows.zip
            profiles-preview-windows.zip.sha256
          if-no-files-found: error

  mac:
    name: mac (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-macos.14.6
            runner: macos-26
          - arch: x86_64
            target: x86_64-macos.14.6
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Stamp source
        run: python3 scripts/stamp-version-hash.py "${{ github.sha }}"
      - name: Build runtime, helper and Profiles launcher
        run: |
          zig build install launcher -Dprofiles=true -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast \
            --summary all
      - name: Verify portable linkage
        run: |
          scripts/check-mac-linkage.sh zig-out/macOSLauncher.app/Contents/MacOS/macOSLauncher \
            zig-out/bin/stfc-community-mod-loader zig-out/lib/libstfc-community-mod.dylib zig-out/bin/stfc-profiles
      - name: Package intermediate prefix
        run: |
          tar -cf profiles-${{ matrix.arch }}.tar -C zig-out macOSLauncher.app \
            bin/stfc-community-mod-loader lib/libstfc-community-mod.dylib bin/stfc-profiles share/stfc-profiles
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: profiles-prefix-${{ matrix.arch }}
          path: profiles-${{ matrix.arch }}.tar
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  package-mac:
    needs: mac
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: profiles-prefix-*
          path: .artifacts
          merge-multiple: true
      - name: Assemble and sign universal preview app
        run: |
          for arch in arm64 x86_64; do
            mkdir -p "staging/$arch"
            tar -xf ".artifacts/profiles-$arch.tar" -C "staging/$arch"
          done
          scripts/assemble-mac-app.sh "staging/STFC Community Mod.app" staging/arm64 staging/x86_64
          APP="staging/STFC Community Mod.app"
          for binary in MacOS/macOSLauncher stfc-community-mod-loader libstfc-community-mod.dylib stfc-profiles; do
            lipo -verify_arch arm64 x86_64 "$APP/Contents/$binary"
          done
          codesign --verify --deep --strict "$APP"
      - name: Package Mac preview
        run: |
          python3 scripts/package-profiles-preview.py --platform macos --prefix staging/arm64 \
            --app "staging/STFC Community Mod.app" --output profiles-preview-macos \
            --source "${{ github.sha }}" --base "${{ env.UPSTREAM_BASE }}" --run "${{ github.run_id }}:${{ github.run_attempt }}"
          ditto -c -k --sequesterRsrc --keepParent profiles-preview-macos profiles-preview-macos.zip
          shasum -a 256 profiles-preview-macos.zip > profiles-preview-macos.zip.sha256
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: profiles-preview-macos-universal
          path: |
            profiles-preview-macos.zip
            profiles-preview-macos.zip.sha256
          compression-level: 0
          if-no-files-found: error
