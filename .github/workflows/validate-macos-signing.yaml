name: Validate macOS signing

# Pushes only inspect the existing submission. New uploads require explicit dispatch.
# Status uses a branch-restricted environment without the signing identity.
on:
  push:
    branches: [ci/macos-signing-play]
  workflow_dispatch:
    inputs:
      operation:
        description: Check an existing submission or start a new signing submission
        type: choice
        options: [status, sign, sign-ripper-test]
        default: status
      submission_id:
        description: Apple submission ID to inspect (status only)
        type: string
        default: 53ec1263-2841-4d27-bfc4-24bf3f8bd785

permissions:
  actions: read
  contents: read

concurrency:
  group: validate-macos-signing
  cancel-in-progress: false

jobs:
  status:
    if: github.repository == 'Guffawaffle/stfc-mod' && (github.event_name == 'push' || inputs.operation == 'status')
    runs-on: macos-26
    timeout-minutes: 10
    environment: macos-notary-status
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Query existing Apple submission
        shell: bash
        env:
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SUBMISSION_ID: ${{ inputs.submission_id || '53ec1263-2841-4d27-bfc4-24bf3f8bd785' }}
        run: |
          set -euo pipefail
          umask 077
          export NOTARY_KEYCHAIN="$RUNNER_TEMP/stfc-notary-status.keychain-db"
          trap 'security delete-keychain "$NOTARY_KEYCHAIN" >/dev/null 2>&1 || true' EXIT
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$NOTARY_KEYCHAIN"
          security unlock-keychain -p "$password" "$NOTARY_KEYCHAIN"
          xcrun notarytool store-credentials stfc-notary --keychain "$NOTARY_KEYCHAIN" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
          unset APPLE_APP_SPECIFIC_PASSWORD password
          bash scripts/check-macos-notarization.sh "$SUBMISSION_ID"
      - name: Remove temporary status keychain
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/stfc-notary-status.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/stfc-notary-status.keychain-db"
          fi
      - name: Upload status and available Apple log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-notarization-status
          path: macos-notarization-status/
          if-no-files-found: ignore
          retention-days: 30

  resolve:
    if: github.repository == 'Guffawaffle/stfc-mod' && github.event_name == 'workflow_dispatch' && (inputs.operation == 'sign' || inputs.operation == 'sign-ripper-test')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      run_id: ${{ steps.build.outputs.run_id }}
      source_sha: ${{ steps.build.outputs.source_sha }}
    steps:
      - name: Select successful build before requesting signing approval
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == sign-ripper-test ]]; then
            sha=07ef78ba81055168fb21443d79719eae11d2f31d
            run=40739520448
            for attempt in {1..60}; do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "$RUNNER_TEMP/ripper-build.json"
              jq -e --arg sha "$sha" --arg repo "$GITHUB_REPOSITORY" '
                .head_sha == $sha and .repository.full_name == $repo and
                .head_branch == "review/ripper-play-migration-checkpoint-20261025" and
                .event == "push" and .path == ".github/workflows/ci.yaml"
              ' "$RUNNER_TEMP/ripper-build.json" >/dev/null
              status=$(jq -r .status "$RUNNER_TEMP/ripper-build.json")
              if [[ "$status" == completed ]]; then
                jq -e '.conclusion == "success"' "$RUNNER_TEMP/ripper-build.json" >/dev/null
                break
              fi
              echo "Waiting for exact Ripper Build $run ($status), attempt $attempt/60"
              sleep 30
            done
            jq -e '.status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/ripper-build.json" >/dev/null
          else
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/play" --jq '.object.sha')
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$sha&branch=play&event=push&status=success" --jq '.workflow_runs[0].id')
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$run" =~ ^[1-9][0-9]*$ ]]
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    uses: ./.github/workflows/sign-macos.yaml
    secrets: inherit
    with:
      build_run_id: ${{ needs.resolve.outputs.run_id }}
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      ripper_test: ${{ inputs.operation == 'sign-ripper-test' }}
