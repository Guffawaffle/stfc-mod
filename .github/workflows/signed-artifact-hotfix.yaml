name: Signed beta artifact gallery hotfix

on:
  push:
    tags: ["v1.1.9.beta.1-artifact-hotfix.1"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: signed-artifact-hotfix-${{ github.ref }}
  cancel-in-progress: false

env:
  # Released upstream beta plus the exact relocation fix from PR #303, built on this fork.
  SOURCE_COMMIT: 4932ee7a90235ba51d4452de2ebe269a042a9d02
  BUILD_RUN_ID: "36907061068"
  UNSIGNED_SHA256: 5a23aa90f8c568db2bdb3b74c770f76b967f4ce1fca3a12cb30732e341dc7674
  RELEASE_TAG: v1.1.9.beta.1-artifact-hotfix.1

jobs:
  prepare:
    if: github.repository == 'Guffawaffle/stfc-mod'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download and verify exact beta hotfix artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REF_TYPE -ne 'tag' -or $env:RELEASE_TAG -cne 'v1.1.9.beta.1-artifact-hotfix.1') {
            throw 'This one-off workflow only publishes v1.1.9.beta.1-artifact-hotfix.1 from its tag.'
          }
          if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or $env:BUILD_RUN_ID -notmatch '^[1-9][0-9]*$') {
            throw 'An exact source commit and numeric workflow run ID are required.'
          }
          $runJson = gh api "repos/Guffawaffle/stfc-mod/actions/runs/$env:BUILD_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read upstream run.' }
          $run = $runJson | ConvertFrom-Json
          if ($run.repository.full_name -cne 'Guffawaffle/stfc-mod' -or $run.head_sha -cne $env:SOURCE_COMMIT -or
              $run.event -ne 'push' -or $run.head_branch -cne 'release/artifact-gallery-hotfix-beta' -or $run.conclusion -ne 'success' -or
              $run.run_attempt -ne 1 -or $run.path -ne '.github/workflows/ci.yaml') {
            throw 'Run must be the pinned successful beta hotfix branch CI push.'
          }
          $jobsJson = gh api "repos/Guffawaffle/stfc-mod/actions/runs/$env:BUILD_RUN_ID/attempts/1/jobs?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read pinned build jobs.' }
          $jobs = $jobsJson | ConvertFrom-Json
          foreach ($jobName in @('build-win', 'build-mac (x86_64)', 'build-mac (arm64)')) {
            $job = @($jobs.jobs | Where-Object { $_.name -ceq $jobName })
            if ($job.Count -ne 1 -or $job[0].conclusion -ne 'success') {
              throw "Pinned validation job did not pass: $jobName"
            }
          }
          New-Item -ItemType Directory -Path payload | Out-Null
          gh run download $env:BUILD_RUN_ID --repo Guffawaffle/stfc-mod --name stfc-community-mod --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'Upstream artifact download failed.' }
          $files = @(Get-ChildItem payload -Recurse -Force -File)
          if ($files.Count -ne 1 -or $files[0].FullName -ne (Join-Path $PWD 'payload/version.dll')) {
            throw 'Expected exactly one version.dll in the upstream artifact.'
          }
          # This fork branch has no upstream attestation. Pin repository/run/attempt, identity, and SHA256.
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path payload/version.dll))
          $version = $info.FileVersion
          $expected = "stfc-identity-v1;distribution=netniv.stfc-community-mod;source=git:$env:SOURCE_COMMIT;" +
            "base=$env:SOURCE_COMMIT;build=github:$($env:BUILD_RUN_ID):1:windows;mode=release;channel=ci"
          if ($version -cne '1.1.9.1' -or $info.Comments -cne $expected) {
            throw 'Upstream DLL embedded build identity/version mismatch.'
          }
          $hash = (Get-FileHash payload/version.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne $env:UNSIGNED_SHA256) { throw 'Pinned upstream DLL hash mismatch.' }
          [ordered]@{
            upstreamRepository = 'netniV/stfc-mod'
            upstreamBaseline = 'v1.1.9.beta.1'
            upstreamBaselineCommit = '86f5fac83afd81dd6ca804401bba6ade99b344ec'
            sourceRepository = 'Guffawaffle/stfc-mod'
            sourceBranch = 'release/artifact-gallery-hotfix-beta'
            sourceCommit = $env:SOURCE_COMMIT
            buildRunId = $env:BUILD_RUN_ID
            buildRunUrl = $run.html_url
            dllVersion = $version
            fixPullRequest = 'https://github.com/netniV/stfc-mod/pull/303'
            embeddedBuildIdentity = $info.Comments
            provenanceVerification = 'exact fork run/attempt, embedded identity, and pinned SHA256; no upstream attestation'
            unsignedSha256 = $hash
          } | ConvertTo-Json | Set-Content payload/provenance.json -Encoding utf8NoBOM
          "Verified upstream commit: $env:SOURCE_COMMIT`nUnsigned DLL SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Retain verified unsigned input
        uses: actions/upload-artifact@v7.0.1
        with:
          name: upstream-signing-input
          path: payload/
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 15
    environment: windows-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: upstream-signing-input
          path: payload

      - name: Azure login with existing release identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign upstream DLL
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\payload\version.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: STFC Community Mod - beta artifact gallery hotfix
          description-url: https://github.com/Guffawaffle/stfc-mod

      - name: Verify signature and package test release
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.WIN_PUBLISHER_NAME }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sig = Get-AuthenticodeSignature -LiteralPath payload/version.dll
          if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) {
            throw 'A valid, timestamped Authenticode signature is required.'
          }
          $cert = $sig.SignerCertificate
          $publisher = $cert.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if (-not $env:EXPECTED_PUBLISHER -or $publisher -cne $env:EXPECTED_PUBLISHER) {
            throw "Unexpected signing publisher '$publisher'."
          }
          $rsa = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($cert)
          if (-not $rsa -or $rsa.KeySize -gt 4096 -or $rsa.KeySize -lt 2048) {
            throw 'Expected an RSA code-signing certificate supported by Smart App Control.'
          }
          # Use the typed extension to require the Azure Public Trust marker.
          $oids = @($cert.Extensions | Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
            ForEach-Object { $_.EnhancedKeyUsages | ForEach-Object Value })
          if ('1.3.6.1.4.1.311.97.1.0' -notin $oids -or '1.3.6.1.5.5.7.3.3' -notin $oids) {
            throw 'Expected Azure Public Trust code-signing certificate EKUs.'
          }
          $provenance = Get-Content payload/provenance.json -Raw | ConvertFrom-Json -AsHashtable
          $provenance.signedSha256 = (Get-FileHash payload/version.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $provenance.signer = $publisher
          $provenance.certificateThumbprint = $cert.Thumbprint
          $provenance.keyAlgorithm = 'RSA'
          $provenance.keySize = $rsa.KeySize
          $rsa.Dispose()
          $provenance.signingWorkflowCommit = $env:GITHUB_SHA
          $provenance.signingRunUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $provenance | ConvertTo-Json | Set-Content payload/provenance.json -Encoding utf8NoBOM
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item payload/version.dll, payload/provenance.json -Destination release
          Compress-Archive -LiteralPath payload/version.dll -DestinationPath release/stfc-community-mod-artifact-hotfix.zip
          Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
          @"
          Artifact gallery crash hotfix - signed Windows x64 DLL.

          Source: https://github.com/Guffawaffle/stfc-mod/commit/$($provenance.sourceCommit)
          Upstream baseline: https://github.com/netniV/stfc-mod/releases/tag/v1.1.9.beta.1
          Build: $($provenance.buildRunUrl)
          Publisher: $publisher (RSA $($provenance.keySize), valid Authenticode signature and timestamp).

          Includes the artifact-gallery crash fix merged in upstream PR #303:
          https://github.com/netniV/stfc-mod/pull/303
          Upstream stable v1.1.8.0 and beta v1.1.9.beta.1 were published without this fix.
          Preserves all features in upstream v1.1.9.beta.1 and adds only PR #303's x64 relocation fix to game code.
          Windows and both Mac builds passed for the exact source commit above.
          The native relocation regression passed locally against freshly rebuilt corrected SPUD.
          This fork branch build is pinned by repository/run/attempt, embedded identity, and SHA256; it has no upstream attestation.
          Historical gallery opening and Left/Right navigation validation of PR #303 covers Windows client build 263.
          This interim download contains only Windows files and has not been smoke-tested on the current client.
          The DLL reports version 1.1.9.1; the release tag and provenance identify this fixed build.
          This is a community interim release, not an official netniV release.
          The release tag identifies the signing workflow, not the upstream source commit.

          Close the game, back up your existing version.dll, then replace it with version.dll from this release
          (also included in stfc-community-mod-artifact-hotfix.zip). Leave Smart App Control enabled and launch normally.
          Test opening the artifact gallery and navigating artifact details with Left/Right.
          If Windows blocks loading, include the error and the CodeIntegrity event naming the blocked file.
          Restore the backup to undo the test. Automatic updates may replace this test DLL.

          Signed DLL SHA-256: $($provenance.signedSha256)
          "@ | Set-Content release/RELEASE_NOTES.md -Encoding utf8NoBOM

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: signed-artifact-hotfix
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: signed-artifact-hotfix
          path: release
      - name: Publish test prerelease without changing latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
            --title "Beta artifact gallery hotfix (signed Windows): $RELEASE_TAG" \
            --notes-file release/RELEASE_NOTES.md \
            release/version.dll release/stfc-community-mod-artifact-hotfix.zip \
            release/provenance.json release/SHA256SUMS.txt
