# Science-only and dormant hook examples
#
# This file intentionally collects settings that are not considered normal
# production/user-ready surfaces in the private fork. Keep release/example
# guidance in example_community_patch_settings.toml focused on supported
# day-to-day features, and document investigation-only toggles here.
#
# Kir'shara queue settings below currently preserve config/history only. The
# dormant detours are not wired into runtime install on this branch.

[advanced.diagnostics.kirshara_queue]
# Focused Kir'shara queue marker diagnostics preserved for dormant history and
# future investigation. They are not active runtime detours on this branch.
enabled = false

# Dump current ActionQueueManager method metadata at boot.
dump_interesting_methods = false

# Individual queued-combat completion markers. Keep disabled during normal
# play; enable only the narrow marker needed for the current investigation.
on_strike_complete = false
remove_target_and_attack_next = false
check_to_clear_action_queue = false
is_target_valid = false
process_queue_deployed = false
process_queue_target = false
on_set_course_response = false
on_player_fleet_state_changed = false
on_fleet_state_change = false
on_fleets_disposed = false

[advanced.diagnostics]
# Science-only, mutually exclusive ship-state probe selector. The passive mode
# observes Repair ActionStatus transitions without changing return values; the
# Instant-context mode observes the final projected button context; the explicit
# guard mode performs only the projection described below.
# It requires live_query = true so evidence stays in the bounded recent-event
# ring. Restart the client after changing either key.
live_query = false
# repair_action_status_guard changes only Repair Ready+Repairing to Disabled.
# repair_action_status_hold preserves the last coherent in-progress Repair status across transient Ready only while
# the fleet is currently Repairing, and
# passively correlates the final Instant context, the human's Repair button click, and downstream help dispatch.
# It also suppresses the exact Docked/previous-Repairing stale Instant click race proven to open either a paid
# confirmation or Ship Error after Repair has already completed.
ship_state_probe = "off" # off | repair_action_status | repair_action_status_guard | repair_action_status_hold | repair_instant_context
# Hard one-event caller-stack airlock. Leave zero unless a probe contract has
# approved the exact transition and the current run.
ship_state_probe_stack_budget = 0 # 0 | 1

[advanced.kirshara_queue]
# Focused Kir'shara queued-combat advancement repair. This is currently a
# dormant science surface: preserve the config contract, but do not treat it as
# production/user-ready behavior or a live runtime hook path.
enabled = false

# Experimental repair candidate for off-screen queued combat. It replays the
# target-bearing queue commit when native only emits the player fleet combat
# start event. Keep false unless testing Kir'shara queue advancement.
course_target_completion = false

[advanced.queue]
# Legacy queue-add experiment/dev-test namespace. These keys do not control
# Kir'shara queue progression repair.

# Master opt-in gate for the legacy queue repair and direct-handler experiments.
queue_repair_enabled = false

# Use the widget's queue-click event handler directly instead of the generic
# button press path. Ignored unless queue_repair_enabled is true.
queue_add_direct_handler = false
