# Subgroup: Diagnostics
# ---------------------

debug = false
logging = false
# Explicit opt-in local JSONL fallback feed for basic installs and offline review.
# Keep this disabled unless you specifically need local file capture. Enabling it
# adds write overhead and can create large storage churn. Prefer ingress targets
# such as sidecar, spocks.club, or other HTTP consumers for durable export.
sidecar_jsonl = false
# Keep the local sidecar JSONL feed cyclic so diagnostic replay does not grow
# unbounded. Larger values increase storage churn. Set both replay seconds and
# recent logs to 0 only for explicit temporary unlimited capture.
sidecar_jsonl_replay_seconds = 30
# Optional second cap on retained battle-log groups. Larger values increase
# storage churn.
sidecar_jsonl_recent_logs = 300

# Subgroup: Network
# -----------------

resolver_cache_ttl = "300"
verify_ssl = true
# Leaving TLS verification enabled is strongly recommended. If verify_ssl is set
# to false, the mod ignores it unless this deliberately unsafe override is
# also true. When enabled, the mod warns loudly at launch because sync traffic
# can be intercepted by a proxy or network attacker.
allow_unsafe_tls_without_certificate_validation = false

