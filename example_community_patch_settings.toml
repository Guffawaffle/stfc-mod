[debug]
# Development-only live query channel for AX. When enabled, `ax debug-send`
# can send one JSON request into the running game and receive a JSON response.
live_query = false

# Emit focused refinery lifecycle, selection, analytics, and purchase-result
# breadcrumbs to the legacy plain-text community_patch.log troubleshooting log.
# Keep disabled during normal play because it detours shared shop/showcase
# methods, adds runtime overhead, and is not the preferred export path.
refinery_diagnostics = false

# Emit periodic summaries of hook-owned runtime work so release validation can
# confirm the setting remains documented alongside the rest of the debug surface.
mod_impact_monitor = false

# Realtime trace level for sidecar/AX diagnostics: off, summary, detailed, or verbose.
# Disabled is the normal-play default. Every level above off adds runtime
# overhead, and longer investigations can increase local log/storage churn.
# Prefer sidecar/spocks.club ingress for durable export instead of long-lived
# local capture.
runtime_trace = "off"

# Include trace instrumentation overhead as its own probe so profiler cost can be
# separated from mod and game function timing. This adds more diagnostic work in
# exchange for cleaner attribution.
runtime_trace_track_overhead = true

# Milliseconds between runtime trace summary reports. Lower values increase
# diagnostic log churn. Values are clamped by the mod.
runtime_trace_report_interval_ms = 5000

[ui]
# Skip the reveal box animation, and just open the boxes
always_skip_reveal_sequence = true

# Prevent "escape" from prompting to exit the game
disable_escape_exit = true

# When disable_escape_exit is true, this lets you double-tap Escape to still
# get the exit prompt. The value is the maximum gap in milliseconds between
# two Escape presses to count as a double-tap.
#
#   0   = double-tap disabled, Escape is fully blocked (default)
#   500 = press Escape twice within half a second to trigger the exit prompt
#
# Has no effect when disable_escape_exit is false.
escape_exit_timer = 0

# ⚠️ EXPERIMENTAL: Prevent the first popup advert from appearing
disable_first_popup = false

# ⚠️ EXPERIMENTAL: Prevent the standard move keys from working
disable_move_keys = false

# ⚠️ EXPERIMENTAL: Prevent the standard toast banners from working
disable_toast_banners = false

# Subgroup: Banners
# -----------------

# Specifies types of banners you don't want to see (comma separated)
