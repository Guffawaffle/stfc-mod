[notifications.system]
# Master switch for OS-native system notifications.
enabled = false

[notifications.system.fleet]
# Fleet-bar derived OS notifications.
arrived_in_system = false
arrived_at_destination = false
started_mining = false
node_depleted = false
docked = false
repair_complete = false

[notifications.audio]
# Master switch for in-game audible notification cues.
enabled = false
default_sound = "default"

[notifications.events.fleet]
# Compact per-notification policy rows. These override the legacy split tables above when present.
# system controls desktop notifications; audio controls the generated cue; sound chooses the cue name.
arrived_in_system = { system = false, audio = false, sound = "arrival" }
arrived_at_destination = { system = false, audio = false, sound = "soft" }
